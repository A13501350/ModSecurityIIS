name: Build ModSecurityIIS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan 2.x + Ninja
        run: pip install "conan>=2" ninja

      - name: Set up MSVC toolchain (cl.exe + Windows SDK)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modsecurityiis
          if-no-files-found: warn
          path: |
            build/Release/*.dll
            build/*.dll
