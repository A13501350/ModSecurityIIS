name: Build ModSecurityIIS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Conan 2.x, a 3.x CMake, and Ninja on PATH. Conan is required
      # directly by our build helper (cmake/build_libmodsecurity.cmake), so it
      # must be on PATH (setup-conan@v1 does not expose it to later steps).
      - name: Install Conan 2.x + CMake 3.x + Ninja
        run: pip install "conan>=2" "cmake<4" ninja

      # Cache the Conan package cache. libModSecurity pulls many C/C++
      # dependencies (pcre2, yajl, libxml2, lua, libcurl, poco, ...); caching
      # them avoids re-downloading hundreds of MB on every run. The key pins
      # compiler.version=193 (conancenter's prebuilt binaries) so the cache is
      # only reused for the exact settings we build with.
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan193-${{ runner.os }}-${{ hashFiles('libmodsecurity/build/win32/conanfile.txt') }}
          restore-keys: |
            conan193-${{ runner.os }}-

      - name: Set up MSVC toolchain (cl.exe + Windows SDK)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modsecurityiis
          if-no-files-found: warn
          path: |
            build/Release/*.dll
            build/*.dll
            build/libmodsecurity_build/build_libmodsecurity.log
