name: Build ModSecurityIIS
# Give runs a human-readable name so they can be told apart in the Actions
# list (we repeatedly lost track of which run-id held the modsecurityiis
# artifact, e.g. reuse runs never upload the DLL). `label` wins for dispatched
# runs; a build_run_id appends [reuse <id>] so the source run is obvious. PUSH
# runs have no inputs, so they fall back to the head commit message (single
# line: GitHub renders run-name as-is, and our commits keep a one-line
# subject). Last resort is the plain workflow name.
run-name: >-
  ${{ inputs.label != '' && inputs.label ||
       (github.event_name == 'push' && github.event.head_commit.message) ||
       'Build ModSecurityIIS' }}${{ inputs.build_run_id != '' && format(' [reuse {0}]', inputs.build_run_id) || '' }}

on:
  push:
    branches: [ master ]
    # Skip the ~40-min build on doc/meta-only changes. A push that touches any
    # source, build script, config or the submodule pointer still triggers;
    # only commits where EVERY changed file matches paths-ignore are skipped.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '**/*.editorconfig'
  workflow_dispatch:
    inputs:
      # Human-readable name shown in the Actions list for this run. Leave blank
      # for the default "Build ModSecurityIIS".
      label:
        description: 'Name for this run (shown in the Actions list)'
        required: false
        default: ''
        type: string
      # Reuse a previously built DLL artifact instead of rebuilding (the build job
      # takes ~6 min and is unchanged when only scripts/ci-crs.ps1 is edited). Pass
      # the run-id of any successful build run that produced the `modsecurityiis`
      # artifact. Leave blank to build normally. IMPORTANT: this must be the run-id
      # of a FULL BUILD that actually uploaded the `modsecurityiis` artifact -- a
      # run that itself reused a DLL does NOT re-upload it, so its id will 404.
      build_run_id:
        description: 'Optional run-id of a prior build to reuse the DLL artifact'
        required: false
        default: ''
        type: string
      # Diagnostic toggles for the CRS suite (default OFF -- mainline behavior).
      # ftw_debug: go-ftw --debug on FULL runs (every request/response dump goes to
      #   the go-ftw-output.txt artifact, run log stays compact). Use when chasing
      #   the intermittent "failed to run" flakes.
      ftw_debug:
        description: 'go-ftw --debug on full-suite runs (output to artifact)'
        required: false
        default: false
        type: boolean
      # freb: enable IIS Failed Request Tracing BEFORE go-ftw so it captures the
      #   whole suite (installs IIS-HttpTracing + one iisreset; site is restarted
      #   and probed afterwards). Logs land in C:/inetpub/logs/FailedReqLogFiles
      #   (uploaded as iis-smoke-diagnostics).
      freb:
        description: 'IIS Failed Request Tracing over the full go-ftw run'
        required: false
        default: false
        type: boolean
      # no_gate: for diagnostic/measurement runs that must not page on expected
      #   failures. go-ftw result still printed; the run exits 0.
      no_gate:
        description: 'Do not gate on go-ftw failures (diagnostic runs only)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    # In reuse mode (workflow_dispatch with inputs.build_run_id set) EVERY step
    # below is skipped via `if: inputs.build_run_id == ''`, so this job becomes a
    # near-instant no-op that merely satisfies smoke-iis's `needs`. smoke-iis
    # downloads the prior run's DLL via download-artifact run-id. We cannot skip
    # the job itself (GitHub disallows inputs/github in the needs context), so we
    # gate the steps instead -- this also drops the ~5-min Conan/engine cache and
    # the checkout/Conan/MSVC setup that are dead weight when nothing is built.
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules, recursive)
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Install Conan 2.x and Ninja on PATH. Conan is required directly by our
      # build helper (cmake/build_libmodsecurity.cmake), so it must be on PATH
      # (setup-conan@v1 does not expose it to later steps). The runner's CMake
      # 4.x is used for the build; Conan's own CMake (used when building deps
      # like yajl from source) is pinned to 3.x via a profile override in the
      # build helper, see conan-center-index#26878.
      - name: Install Conan 2.x + Ninja
        if: ${{ inputs.build_run_id == '' }}
        run: pip install "conan>=2" ninja

      # Cache both the Conan package cache and the already-built engine tree.
      # libModSecurity pulls many C/C++ dependencies (pcre2, yajl, libxml2, lua,
      # libcurl, poco, ...) and recompiling them (plus the 230-file engine
      # itself) takes ~30 min, so caching it makes connector-only iterations
      # fast. The key covers the conanfile and our build helper so a dep/flag
      # change invalidates the cached engine.
      - name: Cache Conan packages + engine build
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.conan2/p
            build/libmodsecurity_build
          key: lmengine-${{ runner.os }}-${{ hashFiles('libmodsecurity/build/win32/conanfile.txt') }}-${{ hashFiles('cmake/build_libmodsecurity.cmake') }}
          restore-keys: |
            lmengine-${{ runner.os }}-
            conan193-${{ runner.os }}-

      # Object-level compilation cache. Complements the Conan/engine tree
      # cache above: it pays off when that cache misses (eviction, key bump)
      # and a full ~40-min engine+deps rebuild would otherwise start over.
      - name: Run sccache
        if: ${{ inputs.build_run_id == '' }}
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache env
        if: ${{ inputs.build_run_id == '' }}
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "SCCACHE_GHA_ENABLED=true"
          Add-Content $env:GITHUB_ENV "SCCACHE_IDLE_TIMEOUT=0"
          # Conan-invoked builds need the sccache binary on PATH.
          Add-Content $env:GITHUB_PATH (Split-Path $env:SCCACHE_PATH)

      - name: Set up MSVC toolchain (cl.exe + Windows SDK)
        if: ${{ inputs.build_run_id == '' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ammaraskar/msvc-problem-matcher@0.3.0
        if: ${{ inputs.build_run_id == '' }}

      # The four steps below are already gated. In reuse mode they all skip, as
      # do every step above, so the job is an instant no-op placeholder.
      - name: Configure
        if: ${{ inputs.build_run_id == '' }}
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Build
        if: ${{ inputs.build_run_id == '' }}
        run: cmake --build build --config Release

      - name: sccache stats
        if: ${{ inputs.build_run_id == '' }}
        run: "& $env:SCCACHE_PATH --show-stats"

      - name: Upload artifacts
        if: ${{ inputs.build_run_id == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: modsecurityiis
          if-no-files-found: warn
          path: |
            build/Release/*.dll
            build/*.dll
            build/libmodsecurity_build/build_libmodsecurity.log

  # Packages the built DLL into an MSI and drives it through install,
  # in-place upgrade and uninstall on the runner's IIS.
  package:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download built DLLs
        uses: actions/download-artifact@v8
        with:
          name: modsecurityiis
          path: artifact
          # Same reuse rule as smoke-iis: a prior run's DLL when build_run_id
          # is set, otherwise this run's own artifact.
          run-id: ${{ inputs.build_run_id != '' && inputs.build_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # heat.exe harvests everything in the directory it is pointed at, so
      # stage only the DLLs (the artifact also carries a build log).
      # MSI ProductVersion is numeric: strip the prerelease tag off VERSION
      # ("v0.0.1-vibe" -> 0.0.1). The upgrade test bumps the patch.
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force msi-input | Out-Null
          Get-ChildItem artifact -Recurse -Filter *.dll |
              Copy-Item -Destination msi-input -Force
          $base = ((Get-Content VERSION -TotalCount 1).Trim() -replace "^v","") -replace "-.*$",""
          .\iis\build_msi.bat msi-input $base msi-out

      # Upgrade needs a second, higher ProductVersion sharing the same
      # UpgradeCode.
      - name: Build higher-version MSI
        shell: pwsh
        run: |
          $maj, $min, $pat = (((Get-Content VERSION -TotalCount 1).Trim() -replace "^v","") -replace "-.*$","").Split(".")
          .\iis\build_msi.bat msi-input "$maj.$min.$([int]$pat + 1)" msi-out2

      - name: Install, upgrade, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appcmd = "$env:windir\System32\inetsrv\appcmd.exe"
          $ahConfig = "$env:windir\System32\inetsrv\config\applicationHost.config"
          $installDir = "C:\Program Files\ModSecurityIIS"
          $maj, $min, $pat = (((Get-Content VERSION -TotalCount 1).Trim() -replace "^v","") -replace "-.*$","").Split(".")
          $expected = "$maj.$min.$([int]$pat + 1)"
          $v1 = (Get-ChildItem msi-out -Filter *.msi | Select-Object -First 1).FullName
          $v2 = (Get-ChildItem msi-out2 -Filter *.msi | Select-Object -First 1).FullName

          function Invoke-Msi([string[]]$MsiArgs, [string]$Log) {
              $p = Start-Process msiexec.exe -ArgumentList $MsiArgs -Wait -PassThru
              if ($p.ExitCode -ne 0) {
                  Get-Content $Log -ErrorAction SilentlyContinue | Write-Host
                  throw "msiexec $($MsiArgs -join ' ') failed with $($p.ExitCode)"
              }
          }
          function Assert-True([bool]$Ok, [string]$What) {
              if (-not $Ok) { throw "FAILED: $What" }
              Write-Host "PASS: $What"
          }
          function Test-ModuleRegistered {
              [bool](& $appcmd list modules /name:ModSecurityIIS 2>$null |
                     Select-String "ModSecurityIIS" -Quiet)
          }
          function Get-InstalledVersion {
              (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" |
               Where-Object { $_.DisplayName -eq "ModSecurityIIS" }).DisplayVersion
          }

          Invoke-Msi @("/i", $v1, "/qn", "/norestart", "/l*v", "install.log") "install.log"
          Assert-True (Test-ModuleRegistered) "module registered by install"
          Assert-True (Test-Path "$env:windir\System32\inetsrv\modsecurityiis.dll") "DLL installed to inetsrv"
          Assert-True (Test-Path "$env:windir\System32\inetsrv\config\schema\ModSecurity.xml") "schema installed"
          Assert-True (Test-Path "$installDir\modsecurity.conf") "default configuration installed"
          Assert-True ([bool](Select-String -Path $ahConfig -Pattern 'name="ModSecurity"' -Quiet)) "config section declared"

          Invoke-Msi @("/i", $v2, "/qn", "/norestart", "/l*v", "upgrade.log") "upgrade.log"
          $installed = @(Get-InstalledVersion)
          Assert-True ($installed.Count -eq 1) "upgrade leaves a single product"
          Assert-True ($installed[0] -eq $expected) "upgraded to $expected (found $($installed[0]))"
          Assert-True (Test-ModuleRegistered) "module still registered after upgrade"

          # A worker process that loaded the module keeps the DLL locked, which
          # would downgrade every removal below to "delete on reboot".
          Stop-Service W3SVC -Force -ErrorAction SilentlyContinue
          Stop-Service WAS -Force -ErrorAction SilentlyContinue
          Invoke-Msi @("/x", $v2, "/qn", "/norestart", "/l*v", "uninstall.log") "uninstall.log"
          Assert-True (-not (Test-ModuleRegistered)) "module unregistered by uninstall"
          Assert-True (-not (Test-Path "$env:windir\System32\inetsrv\modsecurityiis.dll")) "DLL removed"
          Assert-True (-not (Test-Path "$installDir\modsecurity.conf")) "configuration removed"
          Assert-True (-not ([bool](Select-String -Path $ahConfig -Pattern 'name="ModSecurity"' -Quiet))) "config section removed"

          # The last native call is `appcmd list modules` against a module that
          # is (correctly) gone, so it leaves a non-zero $LASTEXITCODE for the
          # runner to pick up. Assertions above use throw, not exit codes.
          exit 0

      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modsecurityiis-msi
          if-no-files-found: warn
          path: msi-out/*.msi

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          if-no-files-found: ignore
          path: |
            install.log
            upgrade.log
            uninstall.log

  # Experimental: install the packaged MSI and assert real blocking behavior
  # (header rule, request-body rule, pass-through, audit log, event log), then
  # run the OWASP CRS suite. Failure here fails the workflow.
  smoke-iis:
    runs-on: windows-latest
    # The build job still runs on reuse, but its Configure/Build/Upload steps are
    # gated (if: inputs.build_run_id == '') so the ~6-min compile + DLL upload are
    # skipped. Installing from the MSI means this job no longer needs the raw
    # DLL artifact: package downloads it (reused or fresh) and builds the MSI.
    needs: [build, package]

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download MSI
        uses: actions/download-artifact@v8
        with:
          name: modsecurityiis-msi
          path: msi
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run IIS smoke test
        shell: pwsh
        run: |
          $msi = (Get-ChildItem msi -Filter *.msi | Select-Object -First 1).FullName
          ./scripts/ci-smoke.ps1 -Msi $msi

      - name: Upload MSI install log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iis-msi-install-log
          if-no-files-found: ignore
          path: msi-install.log

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # We cache GOPATH/bin + GOPATH/pkg/mod ourselves below, so disable the
          # action's built-in module cache (it scans for go.mod, which this repo
          # lacks, and logs a noisy "Restore cache failed: ... go.mod" warning).
          cache: false

      - name: Export GOPATH
        id: go-env
        shell: pwsh
        run: |
          $gp = (go env GOPATH)
          Add-Content $env:GITHUB_ENV "GOPATH=$gp"
          echo "GOPATH=$gp"

      # Cache the Go tools installed by ci-crs.ps1 (go-ftw, albedo) and the Go
      # module download cache, so the `go install ...@latest` steps are fast on
      # cache hit. ci-crs.ps1 skips `go install` when the binary is already on
      # PATH (restored from here). Path uses ${{ env.GOPATH }} (set above from
      # `go env GOPATH`) instead of a hardcoded profile path. Key includes the Go
      # version so a toolchain bump invalidates it; restore-keys fall back to any
      # cached Go tools.
      - name: Cache Go tools (go-ftw, albedo)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOPATH }}/bin
            ${{ env.GOPATH }}/pkg/mod
          key: gotools-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            gotools-${{ runner.os }}-

      - name: Test against OWASP CRS (go-ftw + albedo)
        shell: pwsh
        env:
          MODSEC_IIS_FREB: ${{ inputs.freb == true }}
          MODSEC_IIS_FTW_DEBUG: ${{ inputs.ftw_debug == true }}
          # Diagnostic/debug runs are observation, not a gate: a full-suite
          # --debug run is exactly when an intermittent flake may show up, and
          # it must not redden the workflow. Debug runs therefore opt out of
          # go-ftw gating; normal runs keep it ON.
          MODSEC_IIS_NO_GATE: ${{ inputs.no_gate == true || inputs.ftw_debug == true }}
        run: ./scripts/ci-crs.ps1

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iis-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            C:/inetpub/modsec/
            C:/inetpub/logs/modsec-audit/
            C:/inetpub/logs/FailedReqLogFiles/
            C:/inetpub/modsectest/

      - name: Upload FTW output and audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crs-ftw-logs
          if-no-files-found: warn
          path: |
            go-ftw-output.txt
            modsec_crs_audit.log
