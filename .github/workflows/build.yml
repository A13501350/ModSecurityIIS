name: Build ModSecurityIIS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan 2.x
        run: pip install "conan>=2"

      - name: Setup MSBuild (Visual Studio developer environment)
        uses: microsoft/setup-msbuild@v2

      - name: Configure
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modsecurityiis
          if-no-files-found: warn
          path: |
            build/Release/*.dll
