name: Build ModSecurityIIS

on:
  push:
    branches: [ master ]
    # Skip the ~40-min build on doc/meta-only changes. A push that touches any
    # source, build script, config or the submodule pointer still triggers;
    # only commits where EVERY changed file matches paths-ignore are skipped.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
      - '**/*.editorconfig'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules, recursive)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Install Conan 2.x and Ninja on PATH. Conan is required directly by our
      # build helper (cmake/build_libmodsecurity.cmake), so it must be on PATH
      # (setup-conan@v1 does not expose it to later steps). The runner's CMake
      # 4.x is used for the build; Conan's own CMake (used when building deps
      # like yajl from source) is pinned to 3.x via a profile override in the
      # build helper, see conan-center-index#26878.
      - name: Install Conan 2.x + Ninja
        run: pip install "conan>=2" ninja

      # Cache both the Conan package cache and the already-built engine tree.
      # libModSecurity pulls many C/C++ dependencies (pcre2, yajl, libxml2, lua,
      # libcurl, poco, ...) and recompiling them (plus the 230-file engine
      # itself) takes ~30 min, so caching it makes connector-only iterations
      # fast. The key covers the conanfile and our build helper so a dep/flag
      # change invalidates the cached engine.
      - name: Cache Conan packages + engine build
        uses: actions/cache@v6
        with:
          path: |
            ~/.conan2/p
            build/libmodsecurity_build
          key: lmengine-${{ runner.os }}-${{ hashFiles('libmodsecurity/build/win32/conanfile.txt') }}-${{ hashFiles('cmake/build_libmodsecurity.cmake') }}
          restore-keys: |
            lmengine-${{ runner.os }}-
            conan193-${{ runner.os }}-

      # Object-level compilation cache. Complements the Conan/engine tree
      # cache above: it pays off when that cache misses (eviction, key bump)
      # and a full ~40-min engine+deps rebuild would otherwise start over.
      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache env
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "SCCACHE_GHA_ENABLED=true"
          Add-Content $env:GITHUB_ENV "SCCACHE_IDLE_TIMEOUT=0"
          # Conan-invoked builds need the sccache binary on PATH.
          Add-Content $env:GITHUB_PATH (Split-Path $env:SCCACHE_PATH)

      - name: Set up MSVC toolchain (cl.exe + Windows SDK)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ammaraskar/msvc-problem-matcher@0.3.0

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Build
        run: cmake --build build --config Release

      - name: sccache stats
        run: "& $env:SCCACHE_PATH --show-stats"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modsecurityiis
          if-no-files-found: warn
          path: |
            build/Release/*.dll
            build/*.dll
            build/libmodsecurity_build/build_libmodsecurity.log

  # Experimental: deploy the freshly built module to a live IIS on the runner
  # and assert real blocking behavior (header rule, request-body rule,
  # pass-through, audit log, event log). Failure here fails the workflow.
  smoke-iis:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built DLLs
        uses: actions/download-artifact@v8
        with:
          name: modsecurityiis
          path: artifact

      # dumpbin (used by the smoke script to list libModSecurity imports)
      # comes with the MSVC toolchain.
      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run IIS smoke test
        shell: pwsh
        run: ./scripts/ci-smoke.ps1 -DllDir artifact

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          # We cache GOPATH/bin + GOPATH/pkg/mod ourselves below, so disable the
          # action's built-in module cache (it scans for go.mod, which this repo
          # lacks, and logs a noisy "Restore cache failed: ... go.mod" warning).
          cache: false

      - name: Export GOPATH
        id: go-env
        shell: pwsh
        run: |
          $gp = (go env GOPATH)
          Add-Content $env:GITHUB_ENV "GOPATH=$gp"
          echo "GOPATH=$gp"

      # Cache the Go tools installed by ci-crs.ps1 (go-ftw, albedo) and the Go
      # module download cache, so the `go install ...@latest` steps are fast on
      # cache hit. ci-crs.ps1 skips `go install` when the binary is already on
      # PATH (restored from here). Path uses ${{ env.GOPATH }} (set above from
      # `go env GOPATH`) instead of a hardcoded profile path. Key includes the Go
      # version so a toolchain bump invalidates it; restore-keys fall back to any
      # cached Go tools.
      - name: Cache Go tools (go-ftw, albedo)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOPATH }}/bin
            ${{ env.GOPATH }}/pkg/mod
          key: gotools-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            gotools-${{ runner.os }}-

      - name: Test against OWASP CRS (go-ftw + albedo)
        shell: pwsh
        run: ./scripts/ci-crs.ps1 -DllDir artifact

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iis-smoke-diagnostics
          if-no-files-found: ignore
          path: |
            C:/inetpub/modsec/
            C:/inetpub/logs/modsec-audit/
            C:/inetpub/modsectest/

      - name: Upload FTW output and audit log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crs-ftw-logs
          if-no-files-found: warn
          path: |
            go-ftw-output.txt
            modsec_crs_audit.log
