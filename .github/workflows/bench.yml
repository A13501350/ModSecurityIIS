name: Bench v2 vs v3

# This is a measurement tool, not a gate: the numbers are only meaningful when
# everything runs on ONE machine in ONE job, so there is no matrix over arms --
# see bench/run-bench.ps1 for the reasoning.
#
# The push trigger exists for a GitHub limitation, not for CI: the dispatch API
# requires the workflow file to be present on the DEFAULT branch, so while this
# file only lives on a bench/* branch `gh workflow run` answers
# "workflow not found on the default branch". Pushing to bench/** therefore
# also starts a run -- with a minimal, smoke-level parameter set (see the
# Resolve inputs step), so a push checks that the harness still works without
# burning the full ~25 minutes. Real measurements go through workflow_dispatch.
on:
  push:
    branches:
      - 'bench/**'
  workflow_dispatch:
    inputs:
      v2_repo:
        description: 'Repo holding ModSecurity v2 (owner/repo)'
        required: false
        default: 'owasp-modsecurity/ModSecurity'
      v2_ref:
        description: 'Ref of ModSecurity v2 to build'
        required: false
        default: 'v2/master'
      rulesets:
        description: 'R0 = engine on, no rules. R1 = 20 inspection rules + block probe'
        required: false
        default: 'R1'
      scenarios:
        description: 'S1 tiny GET | S2 GET+40 headers | S3 POST 1K | S4 POST 100K | S5 64K response | S6 blocked'
        required: false
        default: 'S1,S3,S4'
      concurrency:
        description: 'Client concurrency levels'
        required: false
        default: '1,16'
      repeats:
        description: 'Repetitions per combination (drift control)'
        required: false
        default: '3'
      duration:
        description: 'Duration of one load run'
        required: false
        default: '20s'
      mode:
        description: 'throughput = full tilt | latency = fixed arrival rate'
        required: false
        default: 'throughput'
        type: choice
        options: [throughput, latency]
      rate:
        description: 'Requests/sec when mode = latency'
        required: false
        default: '500'

jobs:
  # Cheap parse gate, with no dependencies so it runs in parallel with the
  # ~15-minute builds and fails in seconds. Two harness failures so far were
  # PowerShell parse errors (a backtick continuation with a trailing space, and
  # "$i:" being read as a scoped variable reference) that only surfaced AFTER
  # the build and the artifact download. A parse error kills a script before
  # its first line, so nothing else in this workflow can catch it earlier.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse-check PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem bench, scripts -Recurse -Filter *.ps1 | ForEach-Object {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$null, [ref]$errs)
              if ($errs.Count -gt 0) {
                  $failed = $true
                  Write-Host "::error file=$($_.FullName)::$($errs.Count) parse error(s)"
                  $errs | ForEach-Object {
                      Write-Host "    line $($_.Extent.StartLineNumber): $($_.Message)"
                  }
              } else {
                  Write-Host "ok: $($_.FullName.Substring($PWD.Path.Length + 1))"
              }
          }
          if ($failed) { exit 1 }

  # ---------------------------------------------------------------------
  # v2 connector: ModSecurityIIS.dll from the v2 tree (engine compiled in).
  # Mirrors the build job of ModSecurity/.github/workflows/test-ci-windows.yml,
  # narrowed to x64/Release and without ssdeep/Lua/YAJL: those only add
  # failure modes and are irrelevant to the rulesets we measure.
  # ---------------------------------------------------------------------
  build-v2:
    runs-on: windows-latest
    steps:
      # The fallbacks are load-bearing on the push trigger: a push event carries
      # NO inputs, and an empty `repository:`/`ref:` makes actions/checkout fall
      # back to the current repo + triggering ref -- i.e. it would check out
      # ModSecurityIIS itself and CMake would fail with "does not appear to
      # contain CMakeLists.txt" under v2/iis.
      #
      - name: Checkout ModSecurity v2
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.v2_repo || 'owasp-modsecurity/ModSecurity' }}
          ref: ${{ inputs.v2_ref || 'v2/master' }}
          path: v2
          submodules: recursive
          fetch-depth: 0

      # The v2 IIS build compiles apache2/*.c, so it needs the Apache headers
      # and import libs (libhttpd.lib, libapr*.lib). windows-latest ships
      # Apache at C:\tools\Apache24.
      - name: Set Apache root
        shell: pwsh
        run: |
          $root = "C:\tools\Apache24"
          if (-not (Test-Path "$root\lib\libhttpd.lib")) {
            choco install apache-httpd -y --no-progress -r --params="'/installLocation:C:\tools /noService'"
          }
          if (-not (Test-Path "$root\lib\libhttpd.lib")) { throw "Apache dev libs not found under $root" }
          "APACHE_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: TAServers/vcpkg-cache@e848939f754daf406a06006be2e05eb5b17cc481
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prefix: vcpkg-bench-v2/

      - uses: ammaraskar/msvc-problem-matcher@1ebcb382869bfdc2cc645e8a2a43b6d319ea1cc0

      # WITH_YAJL is NOT optional. iis/CMakeLists.txt:159-167 sets it in the
      # unconditional target_compile_definitions block, so msc_logging.c and
      # msc_json.c always emit yajl calls; the `option(WITH_YAJL)` at :176 only
      # controls whether yajl gets LINKED. Leaving it off fails the link with 19
      # unresolved externals. WITH_LUA is genuinely optional (guarded, :172) but
      # is enabled to match the upstream workflow. WITH_SSDEEP is also optional
      # (guarded by #ifdef in re_operators.c) and is left off deliberately -- it
      # would drag in MSYS2 and a hand-generated fuzzy.lib for no measurement
      # benefit. This is the only remaining delta from test-ci-windows.yml
      # besides collapsing its arch/config matrix.
      - name: Configure
        shell: pwsh
        env:
          VCPKG_FEATURE_FLAGS: "binarycaching"
          VCPKG_BINARY_SOURCES: "clear;files,${{ steps.vcpkg-cache.outputs.path }},readwrite"
          VCPKG_DEFAULT_TRIPLET: x64-windows
        run: |
          cmake -DAPACHE_ROOT="$env:APACHE_ROOT" `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
                -DWITH_LUA=ON -DWITH_YAJL=ON `
                -A x64 -S v2/iis -B v2/iis/build

      - name: Build
        shell: pwsh
        run: cmake --build v2/iis/build --config Release

      # w3wp resolves the DLL's imports from its own directory, so everything
      # the connector needs at runtime has to travel together. The build only
      # copies the Apache DLLs (POST_BUILD at iis/CMakeLists.txt:298-310) --
      # the vcpkg ones (yajl, lua, pcre2, libxml2, curl) are NOT staged, and
      # without them LoadLibrary fails outright because Windows resolves every
      # import up front. So sweep both the output dir and the vcpkg bin dirs.
      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force v2-runtime | Out-Null
          Get-ChildItem v2/iis/build/Release -Filter *.dll -Recurse -ErrorAction SilentlyContinue |
            Copy-Item -Destination v2-runtime -Force
          Get-ChildItem v2 -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'vcpkg_installed.*[\\/]bin[\\/]' } |
            Copy-Item -Destination v2-runtime -Force
          Copy-Item v2/iis/ModSecurity.xml v2-runtime/ -Force -ErrorAction SilentlyContinue
          Get-ChildItem v2-runtime | Format-Table Name, Length

      - name: Upload v2 connector
        uses: actions/upload-artifact@v4
        with:
          name: v2-dll
          if-no-files-found: error
          path: v2-runtime/

  # ---------------------------------------------------------------------
  # v3 connector: modsecurityiis.dll + libModSecurity.dll. Same steps as the
  # build job in build.yml (Conan -> engine -> connector).
  # ---------------------------------------------------------------------
  build-v3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Conan 2.x + Ninja
        run: pip install "conan>=2" ninja

      - name: Cache Conan packages + engine build
        uses: actions/cache@v6
        with:
          path: |
            ~/.conan2/p
            build/libmodsecurity_build
          key: lmengine-${{ runner.os }}-${{ hashFiles('libmodsecurity/build/win32/conanfile.txt') }}-${{ hashFiles('cmake/build_libmodsecurity.cmake') }}
          restore-keys: |
            lmengine-${{ runner.os }}-

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache env
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "SCCACHE_GHA_ENABLED=true"
          Add-Content $env:GITHUB_ENV "SCCACHE_IDLE_TIMEOUT=0"
          Add-Content $env:GITHUB_PATH (Split-Path $env:SCCACHE_PATH)

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER_LAUNCHER=sccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

      - name: Build
        run: cmake --build build --config Release

      - name: Collect runtime DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force v3-runtime | Out-Null
          Get-ChildItem build -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'modsecurityiis|libModSecurity' } |
            Copy-Item -Destination v3-runtime -Force
          Copy-Item ModSecurity.xml v3-runtime/ -Force
          Get-ChildItem v3-runtime | Format-Table Name, Length

      - name: Upload v3 connector
        uses: actions/upload-artifact@v4
        with:
          name: v3-dll
          if-no-files-found: error
          path: v3-runtime/

  # ---------------------------------------------------------------------
  # Single runner, single job: every arm is measured here, interleaved.
  # ---------------------------------------------------------------------
  bench:
    needs: [lint, build-v2, build-v3]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Same approach as scripts/smoke.Tests.ps1:83-91 -- Get-WindowsFeature /
      # Install-WindowsFeature with the Web-* names, and only for what is
      # missing. A single Enable-WindowsOptionalFeature call listing several
      # features fails with "One or several parent features are disabled".
      # The feature list is an array rather than a backtick continuation: a
      # backtick followed by a stray trailing space silently stops continuing.
      - name: Enable IIS
        shell: pwsh
        run: |
          $names = @('Web-Static-Content','Web-Default-Doc','Web-Http-Errors','Web-Filtering')
          $features = Get-WindowsFeature $names -ErrorAction SilentlyContinue
          if ($features | Where-Object { -not $_.Installed }) {
              Write-Host "Installing missing IIS features..."
              Install-WindowsFeature $names | Out-Null
          }
          if ((Get-Service W3SVC).Status -ne "Running") { Start-Service W3SVC }
          Get-Service W3SVC | Format-List Name, Status

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Install bombardier
        run: go install github.com/codesenberg/bombardier@latest

      - name: Export GOPATH/bin
        shell: pwsh
        run: |
          $gp = Join-Path (go env GOPATH) "bin"
          Add-Content $env:GITHUB_PATH $gp
          Add-Content $env:GITHUB_ENV "GOPATH=$(go env GOPATH)"

      - name: Download v2 connector
        uses: actions/download-artifact@v4
        with:
          name: v2-dll
          path: artifacts/v2

      - name: Download v3 connector
        uses: actions/download-artifact@v4
        with:
          name: v3-dll
          path: artifacts/v3

      # Resolves the parameters for both entry points. A push event carries no
      # inputs, so each one falls back to a default. Those defaults are the
      # measurement set, not a smoke set: the harness is verified, and a push
      # is currently the only way to start a run (workflow_dispatch needs the
      # file on the default branch). Expect ~45 minutes.
      #
      # R0 = engine on with zero rules (connector overhead only)
      # R1 = 20 inspection rules + block probe
      # c=1 shows pure per-request cost, c=16 is where the v2 connector's
      # global critical section should start to show.
      - name: Resolve inputs
        shell: pwsh
        env:
          # Header-path scenarios only. S3/S4/S7/S8 (anything with a request
          # body) cannot be compared today: the v2 connector returns no
          # response at all with SecRequestBodyAccess On, and the v3 connector
          # stalls on 100 KiB bodies regardless of that switch. Including them
          # would just spend a third of the runtime producing HUNG rows. See
          # "Known defects" in bench/README.md; run them explicitly with
          # -f scenarios=S1,S2,S3,S7 to reproduce.
          BENCH_RULESETS:    ${{ inputs.rulesets    || 'R0,R1'      }}
          BENCH_SCENARIOS:   ${{ inputs.scenarios   || 'S1,S2,S6,S9'}}
          BENCH_CONCURRENCY: ${{ inputs.concurrency || '1,16'       }}
          BENCH_REPEATS:     ${{ inputs.repeats     || '3'          }}
          BENCH_DURATION:    ${{ inputs.duration    || '20s'        }}
          BENCH_MODE:        ${{ inputs.mode        || 'throughput' }}
          BENCH_RATE:        ${{ inputs.rate        || '500'        }}
        run: |
          foreach ($k in 'BENCH_RULESETS','BENCH_SCENARIOS','BENCH_CONCURRENCY',
                         'BENCH_REPEATS','BENCH_DURATION','BENCH_MODE','BENCH_RATE') {
            $v = [Environment]::GetEnvironmentVariable($k)
            Add-Content $env:GITHUB_ENV "$k=$v"
            Write-Host "$k=$v"
          }

      # List inputs travel as env vars and are split in PowerShell: keeps the
      # quoting out of the YAML, where nested quotes bite immediately.
      - name: Run benchmark
        shell: pwsh
        run: |
          ./bench/run-bench.ps1 `
            -V2DllDir artifacts/v2 `
            -V3DllDir artifacts/v3 `
            -Rulesets ($env:BENCH_RULESETS -split ',' | ForEach-Object { $_.Trim() }) `
            -Scenarios ($env:BENCH_SCENARIOS -split ',' | ForEach-Object { $_.Trim() }) `
            -Concurrency ($env:BENCH_CONCURRENCY -split ',' | ForEach-Object { [int]$_.Trim() }) `
            -Repeats $env:BENCH_REPEATS `
            -Duration $env:BENCH_DURATION `
            -Mode $env:BENCH_MODE `
            -Rate $env:BENCH_RATE `
            -OutFile bench-raw.csv

      # Guarded on the CSV: these are bookkeeping steps, and when the benchmark
      # itself fails they should not add two more red steps on top.
      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          if (Test-Path bench-raw.csv) {
              ./bench/summarize.ps1 -Csv bench-raw.csv -OutFile bench-report.md
          } else {
              Write-Host "bench-raw.csv missing -- the benchmark did not complete."
          }

      - name: Show report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path bench-report.md) { Get-Content bench-report.md }
          else { Write-Host "no report" }

      # Everything the modules said, plus the IIS access log. A stalled module
      # is far easier to read from its own trace than to infer from timings.
      - name: Collect diagnostics
        if: always()
        shell: pwsh
        run: |
          . ./bench/iis.ps1
          Save-Diagnostics -Dir diag

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          if-no-files-found: warn
          path: |
            bench-raw.csv
            bench-report.md
            # Raw bombardier payloads: the ground truth for the JSON schema the
            # parser has to match, so a key rename is diagnosable from the
            # artifact instead of another CI round-trip.
            bench-json/
            # Event log, module debug log, IIS access log.
            diag/
