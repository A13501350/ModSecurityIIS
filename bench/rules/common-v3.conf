# Base configuration for the ModSecurity v3 connector (modsecurityiis.dll +
# libModSecurity.dll). Mirror of common-v2.conf -- see the notes there for why
# these values track scripts/ci-crs.ps1:67-81 rather than being invented.

SecRuleEngine On

SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json application/javascript

SecAuditEngine Off

# TEMPORARY, diagnostic only -- see common-v2.conf.
SecDebugLog C:/bench/modsec-debug-v3.log
SecDebugLogLevel 4

SecTmpDir C:/bench/tmp
SecDataDir C:/bench/data
