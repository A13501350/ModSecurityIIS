# Base configuration for the ModSecurity v3 connector (modsecurityiis.dll +
# libModSecurity.dll). Mirror of common-v2.conf -- see the notes there.

SecRuleEngine On

SecRequestBodyAccess On
SecRequestBodyLimit 104857600

SecResponseBodyAccess On
SecResponseBodyMimeType text/plain
SecResponseBodyLimit 10485760

SecAuditEngine Off
SecDebugLogLevel 0

SecTmpDir C:/bench/tmp
SecDataDir C:/bench/data
