# Ruleset R1 -- 20 inspection rules + 1 blocking probe.
#
# Rules are deliberately:
#   * valid in BOTH engines (only @rx/@streq and variables both understand) so
#     the same file can be loaded by v2 and v3;
#   * non-matching on the benchmark's benign traffic, so the measured cost is
#     inspection (variable expansion + regex) and not blocking/audit;
#   * `pass,nolog` so no audit or error-log I/O pollutes the numbers.
#
# The last rule (9001) is the only one that ever fires: it blocks /bench/block,
# which is what scenario S6 measures (the intervention path).

SecRule REQUEST_METHOD "@rx ^(PUT|DELETE|TRACE|CONNECT)$" "id:1001,phase:1,pass,nolog,msg:'bench 1001'"
SecRule REQUEST_URI "@rx (?i)zzbench01" "id:1002,phase:1,pass,nolog,msg:'bench 1002'"
SecRule REQUEST_URI_RAW "@rx (?i)zzbench02" "id:1003,phase:1,pass,nolog,msg:'bench 1003'"
SecRule REQUEST_HEADERS:Host "@rx (?i)zzbench03" "id:1004,phase:1,pass,nolog,msg:'bench 1004'"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)zzbench04" "id:1005,phase:1,pass,nolog,msg:'bench 1005'"
SecRule REQUEST_HEADERS:Accept "@rx (?i)zzbench05" "id:1006,phase:1,pass,nolog,msg:'bench 1006'"
SecRule REQUEST_HEADERS:X-Bench-Filler "@rx (?i)zzbench06" "id:1007,phase:1,pass,nolog,msg:'bench 1007'"
SecRule QUERY_STRING "@rx (?i)zzbench07" "id:1008,phase:1,pass,nolog,msg:'bench 1008'"
SecRule REQUEST_PROTOCOL "@rx (?i)zzbench08" "id:1009,phase:1,pass,nolog,msg:'bench 1009'"
SecRule REQUEST_FILENAME "@rx (?i)zzbench09" "id:1010,phase:1,pass,nolog,msg:'bench 1010'"

SecRule REQUEST_BODY "@rx (?i)zzbench10" "id:1011,phase:2,pass,nolog,msg:'bench 1011'"
SecRule REQUEST_BODY "@rx (?i)zzbench11" "id:1012,phase:2,pass,nolog,msg:'bench 1012'"
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)zzbench12" "id:1013,phase:2,pass,nolog,msg:'bench 1013'"
SecRule REQUEST_HEADERS:Content-Length "@rx (?i)zzbench13" "id:1014,phase:2,pass,nolog,msg:'bench 1014'"
SecRule REQUEST_HEADERS:X-Bench-Filler "@rx (?i)zzbench14" "id:1015,phase:2,pass,nolog,msg:'bench 1015'"
SecRule ARGS "@rx (?i)zzbench15" "id:1016,phase:2,pass,nolog,msg:'bench 1016'"
SecRule ARGS:q "@rx (?i)zzbench16" "id:1017,phase:2,pass,nolog,msg:'bench 1017'"
SecRule ARGS_GET:q "@rx (?i)zzbench17" "id:1018,phase:2,pass,nolog,msg:'bench 1018'"
SecRule QUERY_STRING "@rx (?i)zzbench18" "id:1019,phase:2,pass,nolog,msg:'bench 1019'"
SecRule REQUEST_URI "@rx (?i)zzbench19" "id:1020,phase:2,pass,nolog,msg:'bench 1020'"

# S6 probe: the only rule that fires, and only for /bench/block.
SecRule REQUEST_URI "@streq /bench/block" "id:9001,phase:1,deny,status:403,log,msg:'bench block probe'"
