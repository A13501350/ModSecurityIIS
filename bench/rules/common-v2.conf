# Base configuration for the ModSecurity v2 IIS connector (ModSecurityIIS.dll
# built from owasp-modsecurity/ModSecurity, v2.9.x).
#
# Deliberately mirrors the *proven* configuration in scripts/ci-crs.ps1:67-81,
# which drives POST-heavy CRS traffic through ARR successfully. The earlier
# values here were invented (SecRequestBodyLimit 100 MB, an explicit
# SecResponseBodyLimit, and SecRequestBodyInMemoryLimit 100 MB), and the first
# full run showed v2 hanging on every request with a body -- so the config is
# suspect before the connector is.
#
# Kept minimal and matched 1:1 with common-v3.conf so a difference in the
# numbers is the connector/engine, not the configuration:
#   * engine ON, request body inspected, response body inspected
#   * audit OFF (audit I/O would dominate and differs between the engines)
#   * debug OFF

SecRuleEngine On

# Body inspection ON is the honest baseline -- and it is what v2's stall is
# tied to: with it Off every POST works, with it On every POST stalls. See
# "Known defects" in bench/README.md.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml application/json application/javascript

SecAuditEngine Off

SecDebugLogLevel 0

SecTmpDir C:/bench/tmp
SecDataDir C:/bench/data
