# Default ModSecurity configuration installed with ModSecurityIIS.
# The installer registers it as <system.webServer/ModSecurity configFile="...">;
# edit this file (or point configFile elsewhere) to change engine behaviour.
#
# DetectionOnly logs rule matches without blocking traffic -- the safe starting
# point. Switch to "On" once the rules are tuned.
SecRuleEngine DetectionOnly

SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Auditing stays off until you pick a writable location: the application pool
# identity must be able to create these files, and an unwritable audit log
# makes the engine fail the request rather than log it.
SecAuditEngine Off
# SecAuditLog C:\inetpub\logs\modsec-audit\audit.log
# SecAuditLogType Serial
# SecTmpDir C:\inetpub\modsec\data
# SecDataDir C:\inetpub\modsec\data

# Path is relative to this file; uncomment after copying a mapping next to it.
# SecUnicodeMapFile unicode.mapping 20127

# Rule sets (OWASP CRS and similar) are not part of this package.
# Include C:\inetpub\modsec\crs-setup.conf
